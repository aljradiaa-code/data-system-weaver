name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p dist/client
          cp -r dist/* dist/client/ 2>/dev/null || true

      - name: Add Capacitor Android Platform
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bunx cap init "Data System Weaver" "com.datasystem.weaver" --web-dir dist/client || true
          bunx cap add android || true

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
