name: Gold AI - Smart Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Android build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      auto_repair:
        description: "Enable safe automatic repair"
        required: true
        default: true
        type: boolean

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: gold-ai-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  MAX_REPAIR_ATTEMPTS: "2"

jobs:

  # ==========================================================
  # 1. PROJECT AUDIT
  # ==========================================================

  audit:
    name: "1️⃣ Project Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    outputs:
      has_android: ${{ steps.detect.outputs.has_android }}
      package_manager: ${{ steps.detect.outputs.package_manager }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " GOLD AI PROJECT AUDIT"
          echo "======================================"

          test -f package.json || {
            echo "::error::package.json is missing"
            exit 1
          }

          if [ -f package-lock.json ]; then
            echo "package_manager=npm" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "package_manager=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found"
            exit 1
          fi

          if [ -d android ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
          fi

          echo
          echo "Files:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort | head -300

      - name: Install dependencies
        run: npm ci

      - name: Validate package scripts
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const required = [
            "build",
            "build:mobile"
          ];

          for (const script of required) {
            if (!pkg.scripts?.[script]) {
              console.error(`Missing npm script: ${script}`);
              process.exit(1);
            }
          }

          console.log("Package scripts verified.");
          NODE

      - name: Verify Capacitor config
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f capacitor.config.ts || {
            echo "::error::capacitor.config.ts is missing"
            exit 1
          }

          grep -q "com.goldai.v2" capacitor.config.ts || {
            echo "::error::Unexpected Capacitor appId"
            exit 1
          }

          grep -q "dist/client" capacitor.config.ts || {
            echo "::error::Unexpected Capacitor webDir"
            exit 1
          }

          echo "Capacitor configuration verified."

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint validation
        run: npm run lint

  # ==========================================================
  # 2. WEB BUILD
  # ==========================================================

  web-build:
    name: "2️⃣ Web Production Build"
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Generate mobile HTML
        run: node scripts/build-mobile-html.js

      - name: Validate generated web
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f dist/client/index.html || {
            echo "::error::dist/client/index.html missing"
            exit 1
          }

          test -d dist/client/assets || {
            echo "::error::dist/client/assets missing"
            exit 1
          }

          echo "Web build is valid."

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-web-build
          path: dist/client
          retention-days: 7

  # ==========================================================
  # 3. ANDROID PREPARATION
  # ==========================================================

  android-prepare:
    name: "3️⃣ Prepare Android"
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.BUILD_TOOLS }}"

      - name: Install npm dependencies
        run: npm ci

      - name: Build mobile application
        run: npm run build:mobile

      # ------------------------------------------------------
      # IMPORTANT:
      # Generate Android only if it does not exist.
      # ------------------------------------------------------

      - name: Create Android platform when missing
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d android ]; then
            echo "Android platform does not exist."
            echo "Creating Capacitor Android project..."

            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Verify Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d android/app || {
            echo "::error::android/app does not exist"
            exit 1
          }

          test -f android/gradlew || {
            echo "::error::android/gradlew does not exist"
            exit 1
          }

          chmod +x android/gradlew

          echo "Android project verified."

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-android-project
          path: android
          retention-days: 7

  # ==========================================================
  # 4. SMART BUILD
  # ==========================================================

  build:
    name: "4️⃣ Smart Android Build"
    needs: android-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.BUILD_TOOLS }}"

      - name: Download Android project
        uses: actions/download-artifact@v4
        with:
          name: gold-ai-android-project
          path: android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ------------------------------------------------------
      # First build
      # ------------------------------------------------------

      - name: First Gradle build
        id: first_build
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # ------------------------------------------------------
      # Capture failure
      # ------------------------------------------------------

      - name: Capture build failure
        if: steps.first_build.outcome == 'failure'
        shell: bash
        run: |
          echo "BUILD_FAILED=true" >> "$GITHUB_ENV"

          echo "======================================"
          echo " FIRST BUILD FAILED"
          echo " Starting automatic diagnostics"
          echo "======================================"

          mkdir -p build-diagnostics

          cd android

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            > ../build-diagnostics/gradle-error.log 2>&1 || true

          cd ..

          grep -Ei \
            "error:|failed|exception|could not|unable|manifest|resource|duplicate|namespace|sdk" \
            build-diagnostics/gradle-error.log \
            | tail -200 \
            > build-diagnostics/error-summary.txt || true

      # ------------------------------------------------------
      # Safe automatic repair
      # ------------------------------------------------------

      - name: Automatic repair
        if: steps.first_build.outcome == 'failure'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " SMART REPAIR ENGINE"
          echo "======================================"

          repaired=false

          # Fix executable permission
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            repaired=true
          fi

          # Remove stale Gradle build directories
          rm -rf android/.gradle
          rm -rf android/app/build

          # Remove generated temporary files
          find android -type d -name ".cxx" -prune -exec rm -rf {} + 2>/dev/null || true

          # Ensure local.properties points to installed SDK
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -n "$SDK_PATH" ]; then
            printf 'sdk.dir=%s\n' "$SDK_PATH" > android/local.properties
            repaired=true
          fi

          echo "Safe repairs completed: $repaired"

      # ------------------------------------------------------
      # Second build
      # ------------------------------------------------------

      - name: Retry Android build
        if: steps.first_build.outcome == 'failure'
        id: retry_build
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # ------------------------------------------------------
      # Final build verification
      # ------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            echo
            echo "Generated files:"
            find android/app/build -type f 2>/dev/null | sort || true

            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::APK is suspiciously small."
            exit 1
          fi

          echo "======================================"
          echo " APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: APK integrity check
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          unzip -t "$APK" >/dev/null

          sha256sum "$APK" | tee apk.sha256

      # ------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-v2-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------
      # Upload diagnostics
      # ------------------------------------------------------

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-build-diagnostics
          path: build-diagnostics
          if-no-files-found: ignore
          retention-days: 30

  # ==========================================================
  # 5. FINAL REPORT
  # ==========================================================

  report:
    name: "5️⃣ Build Report"
    needs:
      - audit
      - web-build
      - android-prepare
      - build

    if: always()
    runs-on: ubuntu-24.04

    steps:

      - name: Final status
        shell: bash
        run: |
          echo "======================================"
          echo " GOLD AI ANDROID BUILD REPORT"
          echo "======================================"

          echo "Audit:          ${{ needs.audit.result }}"
          echo "Web Build:      ${{ needs.web-build.result }}"
          echo "Android Prep:   ${{ needs.android-prepare.result }}"
          echo "Android Build:  ${{ needs.build.result }}"

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo
            echo "::error::Android build failed."
            echo "Download the gold-ai-build-diagnostics artifact."
            exit 1
          fi

          echo
          echo "BUILD SUCCESSFUL"
          echo "APK is available in GitHub Actions artifacts."
